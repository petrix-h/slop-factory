<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
window.__sceneState='starting';

/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(987654321);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;}
function fbm(x,y){return (vnoise(x,y)+0.5*vnoise(x*2.13,y*2.13)+0.25*vnoise(x*4.41,y*4.41))/1.75;}
const UP=new THREE.Vector3(0,1,0);
function pathWX(z){return Math.sin(z*0.15)*2;}
function gy(x,z){
  const n=fbm(x*0.02+7.3,z*0.02+2.1);
  let amp=1.3;
  amp*=sstep(13,20,Math.hypot(x,z+1));
  amp*=sstep(8,14,Math.hypot(x-19,z-12));
  if(z>4&&z<48)amp*=sstep(2.5,6.5,Math.abs(x-pathWX(z)));
  return (n-0.5)*2*amp;
}

/* ================= procedural textures (hi-res, soft) ================= */
const ANISO_TEX=[];
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function toTex(c,repeat){
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(repeat)t.repeat.set(repeat[0],repeat[1]);
  ANISO_TEX.push(t);
  return t;
}
function softSpots(g,S,n,rMin,rMax,cols,alpha){
  for(let i=0;i<n;i++){
    const px=rng()*S,py=rng()*S,r=rMin+rng()*(rMax-rMin);
    const gr=g.createRadialGradient(px,py,0,px,py,r);
    gr.addColorStop(0,cols[(rng()*cols.length)|0]);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=alpha*(0.6+rng()*0.8);
    g.fillStyle=gr;
    g.fillRect(px-r,py-r,r*2,r*2);
  }
  g.globalAlpha=1;
}
function softGrain(g,S,n,lightA,darkA){
  for(let i=0;i<n;i++){
    const px=rng()*S,py=rng()*S,r=1.5+rng()*3.5;
    const gr=g.createRadialGradient(px,py,0,px,py,r);
    const c=rng()<0.5?lightA:darkA;
    gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;
    g.fillRect(px-r,py-r,r*2,r*2);
  }
}

const texGround=(()=>{
  const S=2048,P=10.24,cv=makeCanvas(S,S),g=cv.getContext('2d');
  g.lineCap='round';
  g.fillStyle='#272d1f';g.fillRect(0,0,S,S);
  softSpots(g,S,80,140,340,['rgba(35,42,27,0.8)','rgba(44,51,32,0.8)','rgba(51,48,29,0.8)','rgba(42,40,26,0.8)','rgba(31,37,25,0.8)','rgba(56,51,34,0.8)'],0.55);
  softSpots(g,S,40,200,420,['rgba(20,24,15,0.5)'],0.4);
  softGrain(g,S,2600,'rgba(255,255,255,0.03)','rgba(0,0,0,0.04)');
  for(let i=0;i<3800;i++){
    const px=rng()*S,py=rng()*S,l=2+rng()*3.5;
    g.strokeStyle=rng()<0.5?'rgba(60,72,40,0.07)':'rgba(20,26,16,0.08)';
    g.lineWidth=1;
    g.beginPath();g.moveTo(px,py);g.lineTo(px+(rng()-.5)*2,py-l);g.stroke();
  }
  for(let i=0;i<=400;i++){
    const z=6+40*i/400,x=pathWX(z),px=(x+100)*P,py=(z+100)*P,r=13+Math.sin(i*0.7)*2;
    g.fillStyle='#43423e';g.beginPath();g.arc(px,py,r,0,7);g.fill();
    for(let k=0;k<3;k++){
      const a=rng()*6.28,d=r*(0.7+rng()*0.5);
      const gr=g.createRadialGradient(px+Math.cos(a)*d,py+Math.sin(a)*d,0,px+Math.cos(a)*d,py+Math.sin(a)*d,5+rng()*5);
      gr.addColorStop(0,rng()<0.5?'rgba(70,68,62,0.55)':'rgba(35,34,30,0.5)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;
      g.beginPath();g.arc(px+Math.cos(a)*d,py+Math.sin(a)*d,10+rng()*5,0,7);g.fill();
    }
  }
  for(let i=0;i<900;i++){
    const z=6+rng()*40,x=pathWX(z)+(rng()-.5)*1.8;
    const px=(x+100)*P,py=(z+100)*P,r=1.5+rng()*2.5;
    const gr=g.createRadialGradient(px,py,0,px,py,r);
    gr.addColorStop(0,rng()<0.5?'rgba(25,25,22,0.45)':'rgba(90,88,82,0.3)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;
    g.beginPath();g.arc(px,py,r*1.6,0,7);g.fill();
  }
  const treePts=[[22,12],[-28,2],[30,-20],[-30,30]],leafCols=['#8a4a1c','#7a3a18','#9a5a20','#5f4218','#6e4a14'];
  for(let i=0;i<2000;i++){
    let x,z;
    if(rng()<0.6){const tp=treePts[(rng()*treePts.length)|0];x=tp[0]+(rng()-.5)*14;z=tp[1]+(rng()-.5)*14;}
    else{x=(rng()-.5)*190;z=(rng()-.5)*190;}
    const px=(x+100)*P,py=(z+100)*P;
    g.save();g.translate(px,py);g.rotate(rng()*6.28);
    g.fillStyle=leafCols[(rng()*leafCols.length)|0];
    g.globalAlpha=0.3+rng()*0.45;
    g.beginPath();g.ellipse(0,0,2+rng()*3,1.2+rng()*1.5,0,0,7);g.fill();g.restore();
  }
  g.globalAlpha=1;
  const hg=g.createRadialGradient(100*P,100*P,0,100*P,100*P,140*P);
  hg.addColorStop(0,'rgba(0,0,0,0.3)');hg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=hg;g.fillRect(0,0,S,S);
  return toTex(cv);
})();

const texGroundN=(()=>{
  const size=1024,hgt=new Float32Array(size*size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)
    hgt[y*size+x]=fbm((x/size)*4,(y/size)*4)*0.8+fbm((x/size)*11,(y/size)*11)*0.2;
  const cv=makeCanvas(size,size),g=cv.getContext('2d'),img=g.createImageData(size,size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const xl=hgt[y*size+((x-1+size)%size)],xr=hgt[y*size+((x+1)%size)];
    const yu=hgt[((y-1+size)%size)*size+x],yd=hgt[((y+1)%size)*size+x];
    let nx=(xl-xr)*1.1,ny=(yd-yu)*1.1,nz=1;
    const l=Math.hypot(nx,ny,nz);nx/=l;ny/=l;nz/=l;
    const i=(y*size+x)*4;
    img.data[i]=(nx*0.5+0.5)*255;img.data[i+1]=(ny*0.5+0.5)*255;img.data[i+2]=(nz*0.5+0.5)*255;img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(8,8);
  ANISO_TEX.push(t);
  return t;
})();

const texPlaster=(()=>{
  const S=1024,cv=makeCanvas(S,S),g=cv.getContext('2d');
  g.fillStyle='#5d6270';g.fillRect(0,0,S,S);
  softSpots(g,S,60,120,260,['rgba(255,255,255,0.05)','rgba(0,0,0,0.05)'],0.6);
  for(let i=0;i<16;i++){
    const x=rng()*S,w=14+rng()*30,h=140+rng()*420;
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'rgba(20,24,32,0.12)');gr.addColorStop(1,'rgba(20,24,32,0)');
    g.fillStyle=gr;g.fillRect(x,0,w,h);
  }
  for(let i=0;i<10;i++){
    const gr=g.createRadialGradient(rng()*S,rng()*S,0,rng()*S,rng()*S,40+rng()*110);
    gr.addColorStop(0,'rgba(15,18,24,0.08)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(0,0,S,S);
  }
  softGrain(g,S,1800,'rgba(255,255,255,0.02)','rgba(0,0,0,0.025)');
  return toTex(cv,[3,2]);
})();

const texStone=(()=>{
  const S=1024,cv=makeCanvas(S,S),g=cv.getContext('2d');
  g.fillStyle='#3c414b';g.fillRect(0,0,S,S);
  const rowH=104;
  for(let row=0;row<10;row++){
    let x=-rng()*80;
    while(x<S){
      const w=100+rng()*130,y=row*rowH;
      const l=70+rng()*26;
      g.fillStyle=`rgb(${l*0.72|0},${l*0.78|0},${l*0.9|0})`;
      g.fillRect(x+3,y+3,w-6,rowH-6);
      const top=g.createLinearGradient(0,y+3,0,y+18);
      top.addColorStop(0,'rgba(255,255,255,0.07)');top.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=top;g.fillRect(x+3,y+3,w-6,15);
      const bot=g.createLinearGradient(0,y+rowH-18,0,y+rowH-3);
      bot.addColorStop(0,'rgba(0,0,0,0)');bot.addColorStop(1,'rgba(0,0,0,0.2)');
      g.fillStyle=bot;g.fillRect(x+3,y+rowH-18,w-6,15);
      for(let k=0;k<4;k++){
        const gr=g.createRadialGradient(x+20+rng()*(w-40),y+20+rng()*(rowH-40),0,x+20+rng()*(w-40),y+20+rng()*(rowH-40),20+rng()*40);
        gr.addColorStop(0,rng()<0.5?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.05)');
        gr.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=gr;g.fillRect(x,y,w,rowH);
      }
      x+=w;
    }
    g.fillStyle='#23272f';g.fillRect(0,row*rowH,S,5);
  }
  softGrain(g,S,1600,'rgba(255,255,255,0.02)','rgba(0,0,0,0.03)');
  return toTex(cv,[4,2]);
})();

const texShingle=(()=>{
  const S=1024,cv=makeCanvas(S,S),g=cv.getContext('2d');

const texBark=(()=>{
  const S=512,cv=makeCanvas(S,S),g=cv.getContext('2d');
  g.lineCap='round';
  g.fillStyle='#2e241c';g.fillRect(0,0,S,S);
  softSpots(g,S,20,60,140,['rgba(20,14,8,0.4)'],0.5);
  for(let i=0;i<90;i++){
    const x=rng()*S;
    g.strokeStyle=rng()<0.5?'rgba(15,10,6,0.22)':'rgba(80,60,40,0.18)';

  const gr=g.createLinearGradient(0,8,0,120);
  gr.addColorStop(0,'#f2edde');gr.addColorStop(1,'#d5cbaf');

  for(let i=0;i<5;i++){
    const y=28+i*17;

    g.beginPath();g.moveTo(64,y);g.lineTo(40,y-14);g.stroke();

  g.beginPath();g.moveTo(64,8);g.bezierCurveTo(108,30,104,86,64,120);g.bezierCurveTo(24,86,20,30,64,8);g.stroke();
  return toTex(cv);
})();

function radialTex(inner,outer,stops){
  const cv=makeCanvas(256,256),g=cv.getContext('2d');
  const gr=g.createRadialGradient(128,128,inner,128,128,outer);
  for(const [o,c] of stops)gr.addColorStop(o,c);
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  return toTex(cv);
}
const texFog=radialTex(0,128,[[0,'rgba(255,255,255,0.85)'],[0.5,'rgba(255,255,255,0.32)'],[1,'rgba(255,255,255,0)']]);
const texGlow=radialTex(0,32,[[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,0.5)'],[1,'rgba(255,255,255,0)']]);

const texFlame=(()=>{
  const cv=makeCanvas(128,128),g=cv.getContext('2d');
  const gr=g.createRadialGradient(64,82,4,64,70,58);

/* ================= geometry helpers ================= */
function boxUV(geo,w,h,d){
  const uv=geo.attributes.uv;
  const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){
    const idx=f*4+i;
    uv.setXY(idx,uv.getX(idx)*dims[f][0],uv.getY(idx)*dims[f][1]);
  }
  uv.needsUpdate=true;return geo;
}
function M(w,h,d,mat,x=0,y=0,z=0,opts={}){
  const m=new THREE.Mesh(boxUV(new THREE.BoxGeometry(w,h,d),w,h,d),mat);
  m.position.set(x,y,z);
  if(opts.rx)m.rotation.x=opts.rx;
  if(opts.ry)m.rotation.y=opts.ry;
  if(opts.rz)m.rotation.z=opts.rz;
  m.castShadow=opts.cast!==false;
  m.receiveShadow=true;
  scene.add(m);
  return m;
}
function boxIn(parent,w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=true;
  parent.add(m);return m;
}
function addQuad(a,b,c,d,mat,opts={}){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z,d.x,d.y,d.z]),3));
  const u1=Math.hypot(b.x-a.x,b.y-a.y,b.z-a.z),u2=Math.hypot(d.x-a.x,d.y-a.y,d.z-a.z);
  geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array([0,0,u1,0,u1,u2,0,u2]),2));
  geo.setIndex([0,1,2,0,2,3]);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,mat);
  m.castShadow=opts.cast!==false;m.receiveShadow=true;
  scene.add(m);return m;
}

const leafItems=[];
function addLeafCluster(cx,cy,cz,rad,count,palette,size){
  for(let i=0;i<count;i++){
    const vx=(rng()+rng()+rng()-1.5),vy=(rng()+rng()+rng()-1.5)*0.85,vz=(rng()+rng()+rng()-1.5);
    const n=Math.hypot(vx,vy,vz)||1;
    const px=cx+vx/n*rad*(0.3+rng()*0.7);
    const py=cy+vy/n*rad*0.8*(0.3+rng()*0.7);
    const pz=cz+vz/n*rad*(0.3+rng()*0.7);
    const col=new THREE.Color(palette[(rng()*palette.length)|0]);
    col.offsetHSL((rng()-.5)*0.03,(rng()-.5)*0.1,(rng()-.5)*0.08);
    leafItems.push({x:px,y:py,z:pz,rx:rng()*Math.PI,ry:rng()*Math.PI,rz:rng()*Math.PI,s:size*(0.7+rng()*0.6),c:col});
  }
}
function deadTree(x,z,s){
  const baseY=gy(x,z);
  const count=[0];
  function branch(px,py,pz,dir,len,r,depth){
    if(depth>4||count[0]>70)return;
    const steps=3;
    let cur=new THREE.Vector3(px,py,pz),d=dir.clone().normalize();
    for(let i=0;i<steps;i++){
      count[0]++;
      const l=len/steps;
      const r1=Math.max(0.02,r*(1-i*0.16)),r2=Math.max(0.02,r*(1-(i+1)*0.16));
      const geo=new THREE.CylinderGeometry(r2,r1,l,5);
      const m=new THREE.Mesh(geo,matBark);
      m.position.set(cur.x+d.x*l/2,cur.y+d.y*l/2,cur.z+d.z*l/2);
      m.quaternion.setFromUnitVectors(UP,d);
      m.castShadow=true;m.receiveShadow=true;
      scene.add(m);
      cur.addScaledVector(d,l);
      d.add(new THREE.Vector3((rng()-0.5)*0.5,(rng()-0.3)*0.4,(rng()-0.5)*0.5)).normalize();
      if(depth<3&&rng()<0.55){
        const side=new THREE.Vector3((rng()-0.5),0.3+rng()*0.6,(rng()-0.5)).normalize();
        branch(cur.x,cur.y,cur.z,d.clone().lerp(side,0.75).normalize(),len*(0.55+rng()*0.3),r*0.55,depth+1);
      }
    }
  }
  branch(x,baseY,z,new THREE.Vector3(0.05,1,0.05),4.5*s,0.32*s,0);
}
function autumnTree(x,z,s,pal){
  const baseY=gy(x,z);
  let cur=new THREE.Vector3(x,baseY,z);
  let d=new THREE.Vector3((rng()-0.5)*0.2,1,(rng()-0.5)*0.2).normalize();
  for(let i=0;i<4;i++){
    const l=1.1*s,r1=Math.max(0.03,(0.34-0.05*i)*s),r2=Math.max(0.03,(0.30-0.05*i)*s);
    const geo=new THREE.CylinderGeometry(r2,r1,l,6);
    const m=new THREE.Mesh(geo,matBark);
    m.position.set(cur.x+d.x*l/2,cur.y+d.y*l/2,cur.z+d.z*l/2);
    m.quaternion.setFromUnitVectors(UP,d);
    m.castShadow=true;m.receiveShadow=true;
    scene.add(m);
    cur.addScaledVector(d,l);
    d.add(new THREE.Vector3((rng()-0.5)*0.4,(rng()-0.3)*0.2,(rng()-0.5)*0.4)).normalize();
  }
  const nb=4+((rng()*3)|0);
  for(let b=0;b<nb;b++){
    const ox=(rng()-0.5)*3.4*s,oy=(0.6+rng()*1.8)*s,oz=(rng()-0.5)*3.4*s;
    const rad=(1.6+rng()*1.4)*s;
    addLeafCluster(cur.x+ox,cur.y+oy,cur.z+oz,rad,Math.round(rad*30),pal,0.55*s+0.15);
  }
}

function makeGhost(x,y,z,s){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:texGhost,color:0xcfe0ff,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  sp.position.set(x,y,z);sp.scale.set(1.6*s,2.2*s,1);
  scene.add(sp);
  ghostArr.push({sp,ph:rng()*6,cx:x,cz:z,rad:1.5+rng()*2.5,spd:0.12+rng()*0.15,baseY:y});
}

function makeBird(color,wingW){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color,roughness:1,side:THREE.DoubleSide});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6),mat);
  body.scale.set(0.8,0.7,1.4);
  const shape=new THREE.Shape();
  shape.moveTo(0,0);
  shape.quadraticCurveTo(wingW*0.4,wingW*0.35,wingW,wingW*0.3);
  shape.quadraticCurveTo(wingW*0.65,0,wingW*0.95,-wingW*0.25);
  shape.quadraticCurveTo(wingW*0.4,-wingW*0.25,0,-wingW*0.2);
  shape.closePath();
  const wg=new THREE.ShapeGeometry(shape,3);
  const wl=new THREE.Group();const wm1=new THREE.Mesh(wg,mat);wm1.position.x=0.1;wl.add(wm1);
  const wr=new THREE.Group();const wm2=new THREE.Mesh(wg,mat);wm2.scale.x=-1;wm2.position.x=-0.1;wr.add(wm2);
  g.add(body,wl,wr);
  return {g,wl,wr};
}

function spawnBolt(){
  const bx0=(rng()-.5)*300,bz0=-240+rng()*160;
  const endX=bx0+(rng()-.5)*90,endY=12+rng()*28,endZ=bz0+(rng()-.5)*70;
  let x=bx0,y=140,z=bz0;
  for(let i=0;i<BOLT_N;i++){
    boltPos[i*3]=x;boltPos[i*3+1]=y;boltPos[i*3+2]=z;
    x+=(endX-bx0)/BOLT_N+(rng()-.5)*18;
    z+=(endZ-bz0)/BOLT_N+(rng()-.5)*18;
    y-=(140-endY)/BOLT_N;
  }
  boltGeo.attributes.position.needsUpdate=true;
  lightningLight.position.set(bx0,140,bz0);
  lightningLight.target.position.set(bx0*0.3,0,bz0*0.3);
}

/* ================= post-processing (grain off by default) ================= */
const GradeShader={
  uniforms:{tDiffuse:{value:null},time:{value:0},vignette:{value:0.42},grain:{value:0}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float time; uniform float vignette; uniform float grain;
    varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      vec2 p=vUv-0.5;
      float d=dot(p,p);
      c.rgb*=1.0-vignette*smoothstep(0.12,0.45,d);
      if(grain>0.0){
        c.rgb+=(rand(vUv*vec2(1920.0,1080.0)+time*60.0)-0.5)*grain;
      }
      gl_FragColor=c;
    }`
};
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.55,0.72);
composer.addPass(bloomPass);
const gradePass=new ShaderPass(GradeShader);
composer.addPass(gradePass);
composer.addPass(new OutputPass());

const GRAIN_ON=0.045;
const grainBtn=document.getElementById('grainBtn');
function setGrain(on){
  gradePass.uniforms.grain.value=on?GRAIN_ON:0;
  grainBtn.textContent='film grain: '+(on?'on':'off');
  grainBtn.classList.toggle('on',on);
}
grainBtn.addEventListener('click',()=>setGrain(gradePass.uniforms.grain.value===0));
addEventListener('keydown',e=>{if(e.code==='KeyG')setGrain(gradePass.uniforms.grain.value===0);});

const clock=new THREE.Clock();

(function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  WINMAT.warm.emissiveIntensity=1.15+0.25*Math.sin(t*11.3)*Math.sin(t*5.7+1.3);
  WINMAT.green.emissiveIntensity=1.0+0.18*Math.sin(t*2.3+1.0);
  const on=Math.sin(t*0.35+1)>-0.3;
  blinkMat.emissiveIntensity=on?1.0+0.35*Math.sin(t*13):0.04;
  jackMat.emissiveIntensity=1.4+0.5*Math.sin(t*11)*Math.sin(t*6.7+1)+0.25*Math.sin(t*23);
  porchL1.intensity=2.4+1.2*(0.5+0.5*Math.sin(t*11.3)*Math.sin(t*6.1));
  porchL2.intensity=2.4+1.2*(0.5+0.5*Math.sin(t*9.7+2));
  transomL.intensity=2.0+0.8*Math.sin(t*12.7);
  fireL.intensity=4.5+3.5*(0.5+0.5*Math.sin(t*17)*Math.sin(t*11));
  jackLights.forEach((l,i)=>l.intensity=2.0+0.9*(0.5+0.5*Math.sin(t*(9+i*2)+i)));
  wellL.intensity=2.0+0.8*Math.sin(t*1.7+1);
  mushL.intensity=1.6+0.6*Math.sin(t*2.1);
  pathL1.intensity=1.8+0.5*(0.5+0.5*Math.sin(t*8.9));
  pathL2.intensity=1.8+0.5*(0.5+0.5*Math.sin(t*7.3+1));
  swingL.intensity=1.6+0.8*Math.sin(t*13.1);
  cauldronL.intensity=2.5+1.2*Math.sin(t*3.7)+0.5*Math.sin(t*7.3);
  for(const f of flames){
    f.m.scale.y=f.sc*(0.85+0.3*Math.sin(t*13+f.ph)+0.15*Math.sin(t*29+f.ph*2));
    f.m.scale.x=f.sc*(0.9+0.15*Math.sin(t*11+f.ph));
    f.m.material.opacity=0.7+0.25*Math.sin(t*17+f.ph);
    f.m.rotation.y+=dt*0.8;
  }
  /* cauldron */
  cauldronLiq.scale.setScalar(1+0.05*Math.sin(t*3));
  for(const b of bubbles){
    b.ph+=dt*b.spd;
    const life=b.ph%1;
    b.m.position.set(CALD.x+Math.cos(b.a)*b.r*(1-life*0.3),CALD.y+1.14+life*0.5,CALD.z+Math.sin(b.a)*b.r*(1-life*0.3));
    b.m.scale.setScalar(0.5+life*1.5);
    b.m.material.opacity=1-life;
  }
  for(const s of cauldronSmoke){
    const life=((t*0.25)+s.off)%1;
    s.sp.position.set(CALD.x+s.dx*life*2+Math.sin(t*0.6+s.off*7)*0.3,CALD.y+1.3+life*4,CALD.z+s.dz*life*2);
    const sc2=0.6+life*2.4;
    s.sp.scale.set(sc2,sc2,1);
    s.sp.material.opacity=0.2*(1-life)*Math.min(1,life*6);
  }
  for(const w of wispsSky){
    const a=t*0.4+w.ph;
    w.sp.position.set(w.cx+Math.cos(a)*w.r,w.baseY+Math.sin(t*0.9+w.ph)*0.8,w.cz+Math.sin(a)*w.r*0.8);
    w.sp.material.opacity=0.3+0.3*Math.sin(t*1.6+w.ph);
    w.sp.scale.setScalar(0.7+0.25*Math.sin(t*2.1+w.ph));
  }
  /* swinging lantern */
  swing.rotation.x=0.12*Math.sin(t*1.7);
  swing.rotation.z=0.1*Math.sin(t*1.3+1);
  /* figure in the window */
  if(!figState.visible){
    if(t>figState.next){figState.visible=true;figState.until=t+6+rng()*5;}
  }else if(t>figState.until){
    figState.visible=false;figState.next=t+15+rng()*20;
  }
  const figTarget=figState.visible?0.7+0.2*Math.sin(t*0.7):0;
  figMat.opacity=clamp(figMat.opacity+(figTarget-figMat.opacity)*Math.min(1,dt*0.8),0,1);
  figure.position.y=6.3+0.04*Math.sin(t*1.1);
  /* ghostly walker */
  {
    let walkerOp=0;
    if(walker.z===undefined){
      if(t>walker.next){walker.z=44;}
    }else{
      walker.z-=dt*1.1;
      if(walker.z<15){walker.z=undefined;walker.next=t+25+rng()*20;}
      else{
        const wx2=pathWX(walker.z);
        walker.sp.position.set(wx2+Math.sin(t*1.7)*0.3,gy(wx2,walker.z)+1.3,walker.z);
        walkerOp=0.25*Math.min(1,(44-walker.z)*2,(walker.z-15)*2);
      }
    }
    walker.sp.material.opacity+=(walkerOp-walker.sp.material.opacity)*Math.min(1,dt*2);
  }
  /* witch overhead */
  {
    const tw=((t+20)%55)/55;
    if(tw<0.55){
      witch.g.visible=true;
      const k=tw/0.55;
      const px=lerp(-200,200,k);
      const py=52+18*Math.sin(k*Math.PI*1.1);
      const pz=-75+55*Math.sin(k*Math.PI);
      const k2=Math.min(1,k+0.01);
      const qx=lerp(-200,200,k2);
      const qy=52+18*Math.sin(k2*Math.PI*1.1);
      const qz=-75+55*Math.sin(k2*Math.PI);
      witch.g.position.set(px,py+Math.sin(t*2.2)*0.4,pz);
      witch.g.lookAt(qx,qy,qz);
      witch.g.rotation.z+=0.25;
    }else witch.g.visible=false;
  }
  /* crow flock */
  {
    const la=t*0.07;
    const lx=Math.cos(la)*85,lz=-25+Math.sin(la)*85,ly=54;
    const tx=-Math.sin(la),tz=Math.cos(la);
    for(const f2 of flock){
      const px=lx-tx*f2.long+(-tz)*f2.lat;
      const py=ly+Math.sin(t*1.8+f2.ph)*1.0;
      const pz=lz-tz*f2.long+tx*f2.lat;
      f2.b.g.position.set(px,py,pz);
      f2.b.g.lookAt(px+tx,py,pz+tz);
      const fl=Math.sin(t*4.5+f2.ph)*0.8;
      f2.b.wl.rotation.z=fl;f2.b.wr.rotation.z=-fl;
    }
  }
  /* bush eyes */
  for(const ep of eyePairs){
    if(ep.on){
      if(t>ep.until){ep.on=false;ep.next=t+8+rng()*18;}
      else ep.mat.opacity=0.75+0.25*Math.sin(t*3+ep.until);
    }else{
      ep.mat.opacity*=Math.pow(0.001,dt);
      if(t>ep.next){ep.on=true;ep.until=t+2.5+rng()*5;}
    }
  }
  starA.opacity=0.55+0.3*Math.sin(t*1.4);
  starB.opacity=0.55+0.3*Math.sin(t*1.4+Math.PI);
  for(const c of cloudArr){
    c.sp.position.x+=c.spd*dt;
    if(c.sp.position.x>330)c.sp.position.x=-330;
  }
  if(t>=nextStrike){
    spawnBolt();flash=1;
    doubleAt=rng()<0.5?t+0.12:-1;
    nextStrike=t+8+rng()*14;
  }
  if(doubleAt>0&&t>=doubleAt){flash=Math.max(flash,0.85);doubleAt=-1;}
  flash*=Math.exp(-dt*7);
  const f=clamp(flash,0,1);
  lightningLight.intensity=f*7;
  boltMat.opacity=f*1.5;
  boltLine.visible=f>0.02;
  moonDir.intensity=1.5+f*5;
  skyMat.uniforms.flashU.value=f;
  scene.fog.color.copy(baseFogC).lerp(flashFogC,f*0.7);
  for(const b of bats){
    const a=t*b.w+b.ph;
    b.b.g.position.set(b.cx+Math.cos(a)*b.R,b.H+Math.sin(t*1.3+b.ph)*1.4,b.cz+Math.sin(a)*b.R);
    const a2=a+0.1;
    b.b.g.lookAt(b.cx+Math.cos(a2)*b.R,b.H+Math.sin(t*1.3+b.ph)*1.4,b.cz+Math.sin(a2)*b.R);
    const fl=Math.sin(t*b.flap+b.ph)*0.95;
    b.b.wl.rotation.z=fl;b.b.wr.rotation.z=-fl;
  }
  for(const gh of ghostArr){
    const a=t*gh.spd+gh.ph;
    gh.sp.position.x=gh.cx+Math.cos(a)*gh.rad;
    gh.sp.position.z=gh.cz+Math.sin(a)*gh.rad;
    gh.sp.position.y=gh.baseY+Math.sin(t*0.9+gh.ph)*0.5;
    gh.sp.material.opacity=0.2+0.14*Math.sin(t*1.7+gh.ph);
  }
  for(const s of smokeArr){
    const life=((t*0.12)+s.off)%1;
    s.sp.position.set(s.src.x+s.dx*life*4+Math.sin(t*0.5+s.off*9)*0.5,s.src.y+life*7.5,s.src.z+s.dz*life*4);
    const sc2=1.2+life*3.2;
    s.sp.scale.set(sc2,sc2,1);
    s.sp.material.opacity=0.2*(1-life)*Math.min(1,life*6);
  }
  for(const mg2 of mistArr){
    mg2.m.position.x+=mg2.spd*dt*mg2.dir;
    if(mg2.m.position.x>60)mg2.m.position.x=-60;
    if(mg2.m.position.x<-60)mg2.m.position.x=60;
    mg2.m.position.y=mg2.y0+Math.sin(t*0.3+mg2.y0)*0.25;
    mg2.m.rotation.z+=dt*0.02*mg2.dir;
  }
  for(let i=0;i<FL;i++){
    const L=flData[i];
    L.y-=L.vy*dt;
    L.x+=Math.sin(t*1.6+L.ph)*dt*0.8;
    L.z+=Math.cos(t*1.2+L.ph)*dt*0.6;
    if(L.y<gy(L.x,L.z)+0.1){L.y=gy(L.x,L.z)+6+rng()*5;L.x=treeCenters[(rng()*4)|0][0]+(rng()-.5)*9;L.z=treeCenters[(rng()*4)|0][1]+(rng()-.5)*9;}
    flPos[i*3]=L.x;flPos[i*3+1]=L.y;flPos[i*3+2]=L.z;
  }
  flGeo.attributes.position.needsUpdate=true;
  for(let i=0;i<FC;i++){
    const F2=fireflies[i];
    fPos[i*3]=F2.cx+Math.cos(t*F2.a+F2.ph)*F2.r;
    fPos[i*3+1]=F2.baseY+Math.sin(t*F2.b+F2.ph*2)*0.6;
    fPos[i*3+2]=F2.cz+Math.sin(t*F2.a*0.9+F2.ph)*F2.r;
  }
  fGeo.attributes.position.needsUpdate=true;
  fMat.opacity=0.45+0.4*Math.sin(t*2.6);
  for(let i=0;i<EC;i++){
    const E=embers[i];
    E.life+=dt;E.y+=E.vy*dt;E.x+=Math.sin(t*3+E.ph)*dt*0.4;
    if(E.life>2.4){E.life=0;E.y=FIRE.y+0.5;E.x=FIRE.x+(rng()-.5)*0.6;E.z=FIRE.z+(rng()-.5)*0.6;}
    ePos[i*3]=E.x;ePos[i*3+1]=E.y;ePos[i*3+2]=E.z;
  }
  eGeo.attributes.position.needsUpdate=true;
  catTail.rotation.y=Math.sin(t*1.6)*0.35;
  gradePass.uniforms.time.value=t;
  controls.update();
  composer.render();
})();
window.__sceneState='ready';
</script>
