                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hollowgate Manor — a haunted voxel diorama</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07080f;font-family:Georgia,'Times New Roman',serif;}
  #c{position:fixed;inset:0;display:block;}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(4,5,10,.62) 100%);}
  #title{position:fixed;top:26px;left:30px;color:#c9d2ea;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.85);animation:fadein 2.5s ease;}
  #title h1{margin:0;font-size:22px;letter-spacing:.32em;font-weight:600;}
  #title p{margin:6px 0 0;font-size:11px;letter-spacing:.22em;color:#7d879f;text-transform:uppercase;}
  #hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#5d667e;font-size:11px;letter-spacing:.18em;pointer-events:none;text-transform:uppercase;animation:fadein 3.5s ease;}
  #fail{position:fixed;inset:0;display:none;place-items:center;background:#07080f;color:#c9d2ea;text-align:center;padding:30px;line-height:1.8;z-index:10;}
  #fail small{color:#7d879f;}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div id="title"><h1>HOLLOWGATE&nbsp;MANOR</h1><p>a haunted voxel diorama</p></div>
<div id="hint">drag — orbit &nbsp;·&nbsp; scroll — zoom &nbsp;·&nbsp; space — auto-orbit</div>
<div id="fail"><div></div></div>
<script>
  window.__sceneState='loading';
  function showFail(msg){
    const box=document.querySelector('#fail > div');
    if(box){box.innerHTML=msg;document.getElementById('fail').style.display='grid';}
  }
  window.addEventListener('error',function(e){
    if(window.__sceneState!=='ready'){
      showFail('⚠ Scene script error<br/><small>'+(e.message||'unknown error')+'</small><br/>Open the console for details.');
    }
  },true);
  setTimeout(function(){
    if(window.__sceneState==='loading'){
      showFail('⚠ Could not load three.js from the CDN.<br/>Check your connection and reload.');
    }else if(window.__sceneState!=='ready'){
      showFail('⚠ Scene failed to start.<br/>Open the console for details.');
    }
  },8000);
</script>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.__sceneState='starting';

/* ================= utilities ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(13371337);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;}
function fbm(x,y){return (vnoise(x,y)+0.5*vnoise(x*2.13,y*2.13)+0.25*vnoise(x*4.41,y*4.41))/1.75;}
const _cc=new THREE.Color();
function vary(hex,amt=0.1){const hsl={h:0,s:0,l:0};_cc.set(hex).getHSL(hsl);
  _cc.setHSL(hsl.h+(rng()-.5)*.012,clamp(hsl.s+(rng()-.5)*.1,0,1),clamp(hsl.l+(rng()-.5)*amt,0,1));
  return _cc.clone();}

/* ================= terrain ================= */
function pathX(z){const bend=z>38?clamp((48-z)/8,0,1):1;return 2+Math.sin(z*0.22)*3*bend;}
function H(x,z){
  const n=fbm(x*0.045+13.7,z*0.045+7.3);
  let h=0.5+n*2.8;
  const fHouse=sstep(15,25,Math.hypot(x,z+6));
  const fPath=(z>4&&z<49)?sstep(2.6,7,Math.abs(x-pathX(z))):1;
  return h*Math.min(fHouse,fPath);
}
function isPath(x,z){return z>3&&z<49&&Math.abs(x-pathX(z))<2.2;}
function blocked(x,z){
  if(x>-12&&x<12&&z>-16&&z<7)return true;
  if(x>8&&x<19&&z>-16&&z<-4)return true;
  return false;
}

/* ================= voxel storage ================= */
const SOLID=[];
const GLOW={green:[],flicker:[],orange:[],teal:[],warm:[]};
function V(x,y,z,c,sx=1,sy=1,sz=1){SOLID.push({x,y,z,c:(c instanceof THREE.Color)?c:new THREE.Color(c),sx,sy,sz});}
function G(k,x,y,z,c,sx=1,sy=1,sz=1){GLOW[k].push({x,y,z,c:(c instanceof THREE.Color)?c:new THREE.Color(c),sx,sy,sz});}

/* ================= ground ================= */
for(let x=-52;x<52;x++)for(let z=-52;z<52;z++){
  const h=H(x,z);
  if(isPath(x,z)){
    V(x,0,z,vary(0x2a2a30,0.08),1,Math.max(h,0.12),1);
    V(x,0.02,z,vary(rng()<0.8?0x4b4b54:0x393941,0.12),1,0.3,1);
  }else{
    const n2=fbm(x*0.11+50.2,z*0.11+90.7);
    let c;
    if(n2<0.38)c=vary(0x32402a,0.14);
    else if(n2<0.72)c=vary(0x46402a,0.14);
    else c=vary(0x3c301d,0.12);
    V(x,0,z,c,1,Math.max(h,0.12),1);
  }
}
// grass tufts
const tuftCols=[0x3a4a26,0x4a4426,0x2f3a20,0x55502c,0x5a4a22];
for(let i=0;i<1500;i++){
  const x=Math.round(-50+rng()*100),z=Math.round(-50+rng()*100);
  if(blocked(x,z)||isPath(x,z))continue;
  V(x+(rng()-.5)*.6,H(x,z),z+(rng()-.5)*.6,vary(tuftCols[i%tuftCols.length],0.15),0.45,0.35+rng()*0.55,0.45);
}
// rocks
for(let i=0;i<260;i++){
  const x=Math.round(-48+rng()*96),z=Math.round(-48+rng()*96);
  if(blocked(x,z)||isPath(x,z))continue;
  const s=0.35+rng()*0.5;
  V(x,H(x,z),z,vary(rng()<0.7?0x474b54:0x3a3d45,0.12),s,s*(0.6+rng()*0.5),s);
}
// fallen leaves on the ground
const TREES=[[24,18,7],[-26,8,6],[28,-20,5]];
const leafCols=[0x8a4a1c,0x7a3a18,0x9a5a20,0x5f4218,0x6e4a14];
for(let i=0;i<550;i++){
  let x,z;
  if(rng()<0.65){const t=TREES[(rng()*3)|0];x=t[0]+(rng()-.5)*2*t[2];z=t[1]+(rng()-.5)*2*t[2];}
  else{x=-34+rng()*68;z=-30+rng()*64;}
  if(blocked(Math.round(x),Math.round(z)))continue;
  V(x,H(x,z),z,vary(leafCols[(rng()*5)|0],0.1),0.85,0.22,0.85);
}
// distant silhouettes
for(let i=0;i<10;i++){
  const a=rng()*Math.PI*2,r=56+rng()*20;
  const x=Math.round(Math.cos(a)*r),z=Math.round(Math.sin(a)*r);
  V(x,H(x,z),z,0x0e1218,1.5+rng()*2,4+rng()*5,1.5+rng()*2);
}

/* ================= the manor ================= */
const FOUND=0x2b2f38,WALL=0x3d4450,WALL2=0x353c48,ROOF=0x23252e,RIDGE=0x2b2f3c,WOOD=0x4a3524,TRIM=0x221a12;
const OPEN=new Set();
const addOpen=(x,y,z)=>OPEN.add(x+','+y+','+z);
for(let y=2;y<=4;y++)for(let x=-7;x<=-6;x++)addOpen(x,y,1);
for(let y=2;y<=4;y++)for(let x=6;x<=7;x++)addOpen(x,y,1);
for(let y=6;y<=8;y++)for(let x=-7;x<=-6;x++)addOpen(x,y,1);
for(let y=6;y<=8;y++)for(let x=6;x<=7;x++)addOpen(x,y,1);
for(let y=3;y<=4;y++)for(let z=-12;z<=-11;z++)addOpen(-10,y,z);
for(let y=7;y<=8;y++)for(let z=-12;z<=-11;z++)addOpen(-10,y,z);
for(let y=2;y<=3;y++)for(let x=-4;x<=-3;x++)addOpen(x,y,-14);
for(let y=2;y<=3;y++)for(let x=3;x<=4;x++)addOpen(x,y,-14);
for(let y=1;y<=5;y++)for(let x=1;x<=2;x++)addOpen(x,y,1);

for(let x=-10;x<=9;x++)for(let z=-14;z<=1;z++)V(x,0,z,vary(FOUND,0.1),1,1,1);
for(let y=1;y<=9;y++)for(let x=-10;x<=9;x++)for(let z=-14;z<=1;z++){
  if(!(x===-10||x===9||z===-14||z===1))continue;
  if(OPEN.has(x+','+y+','+z))continue;
  V(x,y,z,vary(WALL,0.09),1,1,1);
}
for(const xe of[-10,9])for(let y=10;y<=16;y++)for(let z=-13;z<=0;z++)
  if(Math.abs(z+6.5)<17-y)V(xe,y,z,vary(WALL2,0.09),1,1,1);
for(let x=-11;x<=10;x++)for(let z=-15;z<=2;z++){
  if(x<=-5&&z>=-3)continue;
  V(x,Math.floor(17-Math.abs(z+6.5)),z,vary(ROOF,0.08),1,1,1);
}
for(let x=-4;x<=10;x++){V(x,17,-7,vary(RIDGE,0.06),1,0.7,1);V(x,17,-6,vary(RIDGE,0.06),1,0.7,1);}
for(const y of[10,12,14])for(let x=-11;x<=-5;x++)V(x,y,-3,vary(WOOD,0.08),1,0.7,0.7);
for(let y=9;y<=14;y++)V(-8,y,0,vary(WOOD,0.08),0.6,1,0.6);
for(let i=0;i<5;i++)V(-11+rng()*6,8+rng()*2,-2+rng()*4,vary(ROOF,0.1),0.8,0.8,0.8);
// window panes
for(let y=2;y<=4;y++)for(let x=-7;x<=-6;x++)G('green',x,y,0.75,vary(0x9dffd2,0.06),0.95,0.95,0.5);
for(let y=6;y<=8;y++)for(let x=6;x<=7;x++)G('green',x,y,0.75,vary(0x9dffd2,0.06),0.95,0.95,0.5);
for(let y=2;y<=4;y++)for(let x=6;x<=7;x++)V(x,y,0.8,vary(0x0b0e16,0.05),0.9,0.9,0.5);
V(6.5,3,1.15,vary(0x5a4630,0.1),1.9,0.4,0.3);
V(6.5,3,1.25,vary(0x4e3c28,0.1),0.4,2.2,0.3);
for(let y=6;y<=8;y++)for(let x=-7;x<=-6;x++)V(x,y,0.8,vary(0x0a0d15,0.05),0.9,0.9,0.5);
for(const y0 of[3,7])for(let y=y0;y<=y0+1;y++)for(let z=-12;z<=-11;z++)G('flicker',-10.25,y,z,vary(0x8dffc8,0.06),0.5,0.95,0.95);
for(let y=2;y<=3;y++)for(let x=-4;x<=-3;x++)G('green',x,y,-13.75,vary(0x8dffc8,0.06),0.95,0.95,0.5);
for(let y=2;y<=3;y++)for(let x=3;x<=4;x++)V(x,y,-13.8,vary(0x0b0e16,0.05),0.9,0.9,0.5);
// frames
function trimFront(xc,y0,w,h){
  V(xc,y0-0.2,1.12,vary(TRIM,0.05),w+0.7,0.35,0.3);
  V(xc,y0+h+0.2,1.12,vary(TRIM,0.05),w+0.7,0.35,0.3);
  V(xc-w/2-0.2,y0+h/2,1.12,vary(TRIM,0.05),0.35,h+0.7,0.3);
  V(xc+w/2+0.2,y0+h/2,1.12,vary(TRIM,0.05),0.35,h+0.7,0.3);
}
trimFront(-6.5,2,2,3);trimFront(6.5,2,2,3);trimFront(-6.5,6,2,3);trimFront(6.5,6,2,3);
trimFront(1.5,1,2,4);
// door
for(let y=1;y<=5;y++)for(let x=1;x<=2;x++)V(x,y,1,vary(0x4a1f1b,0.08),0.98,0.98,0.6);
G('warm',1.5,4,0.95,0xffc88a,0.9,0.5,0.3);
V(1.5,5,1,vary(0x3a3f47,0.06),2.8,0.5,0.6);
V(2.3,3,1.25,vary(0x9aa0aa,0.05),0.25,0.35,0.25);
// ivy
const IVY=[0x2f4425,0x3c5530,0x26381f];
function ivyClimb(startX,startZ,face,maxLen){
  let x=startX,z=startZ,y=1;
  for(let i=0;i<maxLen;i++){
    const n=1+((rng()*3)|0);
    for(let j=0;j<n&&y<=10;j++){
      if(face==='f')V(x,y,1.3,vary(IVY[(rng()*3)|0],0.12),0.5+rng()*0.2,0.5+rng()*0.2,0.5);
      else V(-10.3,y,z,vary(IVY[(rng()*3)|0],0.12),0.5,0.5+rng()*0.2,0.5+rng()*0.2);
      y+=rng()<0.72?1:0;
      if(rng()<0.3){if(face==='f')x+=rng()<0.5?1:-1;else z+=rng()<0.5?1:-1;}
    }
  }
}
ivyClimb(-9,1,'f',14);ivyClimb(4,1,'f',12);ivyClimb(8,1,'f',9);ivyClimb(1,-13,'l',10);
// cracks
function crack(x0,y0,face,len){
  for(let i=0;i<len;i++){
    if(face==='f')V(x0,y0-i,1.06,vary(0x1c2026,0.05),0.3,0.7,0.15);
  }
}
crack(-2,8,'f',5);crack(3,7,'f',4);crack(-5,6,'f',3);
// chimney
for(let y=8;y<=18;y++)for(let x=5;x<=6;x++)for(let z=-13;z<=-12;z++)V(x,y,z,vary(0x454a55,0.1),1,1,1);
for(let x=4;x<=7;x++)for(let z=-14;z<=-11;z++){if((x===4||x===7)&&(z===-14||z===-11))continue;V(x,19,z,vary(0x3a3f4a,0.1),1,0.6,1);}
/* ---- tower ---- */
const TX=13,TZ=-10,TR=3.6;
for(let y=0;y<=16;y++)for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++){
  const d=Math.hypot(dx,dz);if(d>TR)continue;
  const x=TX+dx,z=TZ+dz;
  if(x===13&&z===-7&&y>=8&&y<=11){G('green',13,y,-6.7,vary(0x9dffd2,0.06),0.8,0.9,0.6);continue;}
  if(x===13&&z===-7&&y>=3&&y<=4){G('flicker',13,y,-6.7,vary(0x8dffc8,0.06),0.8,0.9,0.6);continue;}
  V(x,y,z,vary(0x414a58,0.09),1,1,1);
}
for(let y=17;y<=21;y++){
  const r=y===17?4.5:4.0-(y-17)*0.85;
  for(let dx=-5;dx<=5;dx++)for(let dz=-5;dz<=5;dz++)
    if(Math.hypot(dx,dz)<=r)V(TX+dx,y,TZ+dz,vary(0x262a35,0.09),1,1,1);
}
V(TX,22,TZ,vary(0x1a1c24,0.05),0.4,2.4,0.4);
V(TX,23.6,TZ,vary(0x101218,0.04),0.8,0.5,0.7);
V(TX-1.3,23.7,TZ,vary(0x101218,0.04),1.1,0.25,0.5);
V(TX+1.3,23.7,TZ,vary(0x101218,0.04),1.1,0.25,0.5);
for(let i=0;i<8;i++)V(TX+3.1,1+i*1.6,TZ-1+(i%3)-1,vary(IVY[i%3],0.12),0.5,0.5,0.5);
/* ---- porch ---- */
for(let x=-4;x<=6;x++)for(let z=2;z<=4;z++)V(x,0,z,vary(0x3a3f47,0.07),1,1,1);
for(let y=1;y<=5;y++){
  for(const px of[-3,5]){V(px,y,4,vary(WOOD,0.1),0.9,1,0.9);V(px,y,2,vary(WOOD,0.1),0.9,1,0.9);}
}
for(let x=-2;x<=4;x++)V(x,4.2,4.5,vary(0x2a2622,0.06),0.18,0.9,0.18);
V(1,5,4.5,vary(0x2a2622,0.06),6.2,0.22,0.22);
for(let x=-4;x<=6;x++){V(x,7,2,vary(ROOF,0.08),1,1,1);for(let z=3;z<=5;z++)V(x,6,z,vary(ROOF,0.08),1,1,1);}
V(-3,4.6,4.75,vary(0x14161c,0.05),0.4,0.7,0.4);
G('warm',-3,4.6,4.85,0xffb877,0.35,0.5,0.35);
for(let x=0;x<=3;x++)for(let z=5;z<=6;z++)V(x,0,z,vary(0x434850,0.07),1,0.6,1);

/* ================= fence & gate ================= */
const FENC=0x17181d;
function fenceLine(x0,z0,x1,z1,gap){
  const horiz=z0===z1;
  const n=Math.abs(horiz?x1-x0:z1-z0);
  for(let i=0;i<=n;i++){
    const x=horiz?x0+i:x0,z=horiz?z0:z0+i;
    const inGap=!!gap&&i>=gap[0]&&i<=gap[1];
    const h=H(x,z);
    if(i%6===0){
      const ph=inGap?1:3;
      for(let y=0;y<=ph;y++)V(x,h+y,z,vary(FENC,0.08),0.7,1,0.7);
      if(!inGap)V(x,h+3.4,z,vary(FENC,0.08),0.45,0.7,0.45);
    }
    if(!inGap){
      if(horiz){V(x,h+1,z,vary(FENC,0.05),1,0.22,0.22);V(x,h+2.1,z,vary(FENC,0.05),1,0.22,0.22);}
      else{V(x,h+1,z,vary(FENC,0.05),0.22,0.22,1);V(x,h+2.1,z,vary(FENC,0.05),0.22,0.22,1);}
    }
  }
}
fenceLine(-40,46,40,46,[39,45]);
fenceLine(-40,-34,40,-34);
fenceLine(-40,-34,-40,46);
fenceLine(40,-34,40,46);
// broken / fallen sections
V(-40,H(-40,13)+0.1,13,vary(FENC,0.08),0.2,0.2,2.5);
V(40,H(40,-8)+0.1,-8,vary(FENC,0.08),0.2,0.2,2.2);
V(10,H(10,-34)+0.1,-34,vary(FENC,0.08),2.4,0.2,0.2);
// gate
const hg=H(0,44);
for(let y=0;y<=4;y++){
  for(let x=-1;x<=0;x++)V(x,hg+y,44,vary(0x454a55,0.08),1,1,1);
  for(let x=4;x<=5;x++)V(x,hg+y,44,vary(0x454a55,0.08),1,1,1);
}
V(-0.5,hg+4.6,44,vary(0x3a3f4a,0.06),2,0.5,1.4);
V(4.5,hg+4.6,44,vary(0x3a3f4a,0.06),2,0.5,1.4);
for(let x=1;x<=3;x++)V(x,hg+1.5,44,vary(FENC,0.08),0.25,2.6,0.25);
V(2,hg+2.6,44,vary(FENC,0.08),2.6,0.25,0.25);
V(2,hg+1.6,44,vary(FENC,0.08),2.6,0.25,0.25);
V(2.5,0.1,46,vary(FENC,0.08),0.25,0.25,3);
V(3,0.1,47.5,vary(FENC,0.08),0.25,0.25,2);
// sign post
V(5.5,H(5.5,45)+0.5,45,vary(WOOD,0.1),0.3,1.8,0.3);
V(5.5,H(5.5,45)+1.6,45,vary(0x4a3524,0.1),1.6,0.7,0.25);

/* ================= graveyard ================= */
const GRAVEC=0x525763;
function grave(x,z,type,rune){

  const e1=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.26,0.1),em);e1.position.set(-0.28,1.5,0.46);
  const e2=e1.clone();e2.position.x=0.28;
  const b1=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.5,0.4),mat);b1.position.set(-0.55,-0.6,0);b1.rotation.z=0.3;
  const b2=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.5,0.4),mat);b2.position.set(0.55,-0.6,0);b2.rotation.z=-0.3;
  grp.add(m1,m2,m3,e1,e2,b1,b2);
  grp.position.set(x,y,z);grp.scale.setScalar(s);scene.add(grp);
  ghosts.push({grp,mat,ph:rng()*6,cx:x,cz:z,rad:drift?2+rng()*3:0.12,spd:drift?0.15+rng()*0.2:0.6,baseY:y});
}
makeGhost(18,6,22,1,true);
makeGhost(24,5.5,-18,0.8,true);
makeGhost(-6.5,7.6,0.5,0.55,false);
/* chimney smoke */
const smoke=[],chim=new THREE.Vector3(5.5,19.8,-12.5);
for(let i=0;i<9;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0x9aa2bd,transparent:true,opacity:0.16,depthWrite:false}));
  scene.add(m);
  smoke.push({m,off:i/9,dx:(rng()-.5)*2,dz:(rng()-.5)*2});
}
/* fog banks */
const fogs=[];
for(let i=0;i<7;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(16+rng()*10,1.4,10+rng()*8),
    new THREE.MeshBasicMaterial({color:0x7f88ad,transparent:true,opacity:0.05+rng()*0.05,depthWrite:false}));
  m.position.set((rng()-.5)*90,0.7+rng()*1.5,(rng()-.5)*80);
  scene.add(m);fogs.push({m,spd:0.5+rng()*0.7,dir:rng()<0.5?1:-1,y0:m.position.y});
}
/* falling leaves */
const LC=260;
const lPos=new Float32Array(LC*3),lCol=new Float32Array(LC*3);
const leaves=[];
{
  const colC=new THREE.Color();
  for(let i=0;i<LC;i++){
    let x,z;
    if(rng()<0.7){const tr=TREES[(rng()*3)|0];x=tr[0]+(rng()-.5)*14;z=tr[1]+(rng()-.5)*14;}
    else{x=(rng()-.5)*70;z=(rng()-.5)*70;}
    colC.set(leafCols[(rng()*5)|0]);
    lCol[i*3]=colC.r;lCol[i*3+1]=colC.g;lCol[i*3+2]=colC.b;
    leaves.push({x,y:6+rng()*16,z,vy:0.8+rng()*0.9,ph:rng()*6});
  }
}
const lGeo=new THREE.BufferGeometry();
lGeo.setAttribute('position',new THREE.BufferAttribute(lPos,3));
lGeo.setAttribute('color',new THREE.BufferAttribute(lCol,3));
scene.add(new THREE.Points(lGeo,new THREE.PointsMaterial({size:0.55,vertexColors:true,transparent:true,opacity:0.95})));
/* spirit wisps */
const WC=46,wPos=new Float32Array(WC*3),wCol=new Float32Array(WC*3);
const wisps=[];
{
  const colC=new THREE.Color();
  for(let i=0;i<WC;i++){
    let bx2,bz2;
    if(i<20){bx2=-20+(rng()-.5)*7;bz2=26+(rng()-.5)*7;}
    else if(i<34){bx2=18+(rng()-.5)*12;bz2=20+(rng()-.5)*14;}
    else{bx2=2+(rng()-.5)*8;bz2=4+(rng()-.5)*8;}
    colC.set(rng()<0.7?0x59e8d2:0xffb066);
    wCol[i*3]=colC.r;wCol[i*3+1]=colC.g;wCol[i*3+2]=colC.b;
    wisps.push({bx:bx2,by:H(bx2,bz2)+1+rng()*2,bz:bz2,a:0.6+rng()*0.8,b:0.8+rng()*0.8,c:0.7+rng()*0.8,ph:rng()*6});
  }
}
const wGeo=new THREE.BufferGeometry();
wGeo.setAttribute('position',new THREE.BufferAttribute(wPos,3));
wGeo.setAttribute('color',new THREE.BufferAttribute(wCol,3));
const wMat=new THREE.PointsMaterial({size:0.32,vertexColors:true,transparent:true,opacity:0.8,fog:false});
scene.add(new THREE.Points(wGeo,wMat));
/* point lights (r155+ physical units: intensity is in candela) */
const porchLight=new THREE.PointLight(0xffb066,12,18,2);porchLight.position.set(-3,4.5,5);scene.add(porchLight);
const plights=[];
for(const[px,pz]of[[-16,21],[-17,15],[-11,24]]){
  const l=new THREE.PointLight(0xff8a2a,9,12,2);l.position.set(px,H(px,pz)+1.2,pz);scene.add(l);plights.push(l);
}
const mushLight=new THREE.PointLight(0x46e0c8,5,9,2);mushLight.position.set(-20,H(-20,26)+1.5,26);scene.add(mushLight);
const winLight=new THREE.PointLight(0x9fffd0,3,8,2);winLight.position.set(-6.5,7.5,1.6);scene.add(winLight);

/* ================= animation ================= */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();controls.autoRotate=!controls.autoRotate;}});
const clock=new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  // flicker
  mF.color.setScalar(0.75+0.25*Math.sin(t*11.3)*Math.sin(t*5.7+1.3));
  mO.color.setScalar(0.8+0.2*Math.sin(t*9.1)*Math.sin(t*4.3));
  mW.color.setScalar(0.85+0.15*Math.sin(t*13.7));
  porchLight.intensity=10+4*(0.5+0.5*Math.sin(t*11.3)*Math.sin(t*6.1));
  plights.forEach((l,i)=>l.intensity=7+3*(0.5+0.5*Math.sin(t*(8+i)+i*2)));
  mushLight.intensity=4+1.5*Math.sin(t*2.1);
  winLight.intensity=2+1.2*Math.sin(t*1.3);
  // stars
  starA.opacity=0.55+0.3*Math.sin(t*1.4);
  starB.opacity=0.55+0.3*Math.sin(t*1.4+Math.PI);
  // bats
  for(const b of bats){
    const a=t*b.w+b.ph;
    b.g.position.set(b.cx+Math.cos(a)*b.R,b.H+Math.sin(t*1.3+b.ph)*1.6,b.cz+Math.sin(a)*b.R);
    const a2=a+0.1;
    b.g.lookAt(b.cx+Math.cos(a2)*b.R,b.H+Math.sin(t*1.3+b.ph)*1.6,b.cz+Math.sin(a2)*b.R);
    const f=Math.sin(t*b.flap+b.ph)*0.95;
    b.wl.rotation.z=f;b.wr.rotation.z=-f;
  }
  // ghosts
  for(const gh of ghosts){
    const a=t*gh.spd+gh.ph;
    gh.grp.position.x=gh.cx+Math.cos(a)*gh.rad;
    gh.grp.position.z=gh.cz+Math.sin(a)*gh.rad;
    gh.grp.position.y=gh.baseY+Math.sin(t*0.9+gh.ph)*0.5;
    gh.mat.opacity=0.24+0.14*Math.sin(t*1.7+gh.ph);
  }
  // smoke
  for(const s of smoke){
    const life=((t*0.12)+s.off)%1;
    s.m.position.set(chim.x+s.dx*life*5+Math.sin(t*0.5+s.off*9)*0.6,chim.y+life*8,chim.z+s.dz*life*5);
    s.m.scale.setScalar(0.8+life*2.6);
    s.m.material.opacity=0.16*(1-life);
  }
  // fog banks
  for(const f of fogs){
    f.m.position.x+=f.spd*dt*f.dir;
    if(f.m.position.x>58)f.m.position.x=-58;
    if(f.m.position.x<-58)f.m.position.x=58;
    f.m.position.y=f.y0+Math.sin(t*0.3+f.y0)*0.3;
  }
  // leaves
  for(let i=0;i<LC;i++){
    const L=leaves[i];
    L.y-=L.vy*dt;L.x+=Math.sin(t*1.6+L.ph)*dt*0.7;L.z+=Math.cos(t*1.2+L.ph)*dt*0.5;
    if(L.y<H(L.x,L.z)+0.2){L.y=12+rng()*12;L.x=(rng()-.5)*70;L.z=(rng()-.5)*70;}
    lPos[i*3]=L.x;lPos[i*3+1]=L.y;lPos[i*3+2]=L.z;
  }
  lGeo.attributes.position.needsUpdate=true;
  // wisps
  for(let i=0;i<WC;i++){
    const W=wisps[i];
    wPos[i*3]=W.bx+Math.cos(t*W.a+W.ph)*0.7;
    wPos[i*3+1]=W.by+Math.sin(t*W.b+W.ph*1.3)*0.45;
    wPos[i*3+2]=W.bz+Math.sin(t*W.c+W.ph*0.7)*0.7;
  }
  wGeo.attributes.position.needsUpdate=true;
  wMat.opacity=0.55+0.35*Math.sin(t*2.3);
  controls.update();
  renderer.render(scene,camera);
})();
window.__sceneState='ready';
</script>
